version: '3.8'

services:
  web:
    build: .
    container_name: art_gallery_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: gallery_user
      DB_PASS: secure_password
      DB_NAME: my_database
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: art_gallery_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my_database
      MYSQL_USER: gallery_user
      MYSQL_PASSWORD: secure_password
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:3306:3306"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: art_gallery_tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - web

volumes:
  db_data:
